<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="בחירה יומית של חמש הוויות, עם מילים על איך מממשים אותן היום.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הוויות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1829" media="(prefers-color-scheme: dark)">
<title>הוויות</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F6;
    --ink: #35323C;
    --muted: #857F8C;
    --line: rgba(53, 50, 60, .13);
    --bar: rgba(250, 248, 246, .92);
    --field: #FFFFFF;
    --on-pastel: #35323C;
    --p1: #F7DCE1;
    --p2: #FAE4CE;
    --p3: #F5EFC9;
    --p4: #DCEBD9;
    --p5: #D6E6F2;
    --p6: #E4DEF2;

    --display: "Frank Ruhl Libre", "David Libre", "David", "Times New Roman", serif;
    --ui: "IBM Plex Sans Hebrew", "Arimo", "Arial Hebrew", Arial, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1829;
      --ink: #EDE8F2;
      --muted: #9890A2;
      --line: rgba(237, 232, 242, .15);
      --bar: rgba(28, 24, 41, .92);
      --field: #261E38;
      --on-pastel: #2A1E3A;
      --p1: #EAB8C4;
      --p2: #EAC8A8;
      --p3: #E0D8A0;
      --p4: #B8D4B0;
      --p5: #AACCDE;
      --p6: #C4B8DE;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1829;
    --ink: #EDE8F2;
    --muted: #9890A2;
    --line: rgba(237, 232, 242, .15);
    --bar: rgba(28, 24, 41, .92);
    --field: #261E38;
    --on-pastel: #2A1E3A;
    --p1: #EAB8C4;
    --p2: #EAC8A8;
    --p3: #E0D8A0;
    --p4: #B8D4B0;
    --p5: #AACCDE;
    --p6: #C4B8DE;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 1.0625rem;
    line-height: 1.55;
    direction: rtl;
    text-align: right;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .top {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    padding: 1rem 1.35rem .5rem;
    transition: opacity .4s ease;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.3rem; margin: 0; }
  .nav { display: flex; gap: 1.2rem; }
  .nav button {
    padding: .35rem 0;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    min-height: 2.5rem;
    font-size: .98rem;
  }
  .nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--p2); font-weight: 600; }

  #app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .page { width: 100%; max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.35rem 2.5rem; }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    line-height: 1.18;
    margin: .25rem 0 .6rem;
  }
  .lede { color: var(--muted); margin: 0 0 1.6rem; }

  /* setup */
  .setup { margin: auto; }
  .choices { display: flex; flex-direction: column; gap: .7rem; margin: 0 0 1.4rem; }
  .choice {
    display: block;
    width: 100%;
    padding: 1rem 1.2rem;
    border-radius: 18px;
    background: var(--p5);
    color: var(--on-pastel);
    font-size: 1.1rem;
    text-align: right;
    transition: transform .15s ease;
  }
  .choice + .choice { background: var(--p1); }
  .choice:active { transform: scale(.985); }
  .choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

  /* choose */
  .choose { padding-bottom: 8rem; }
  .field { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  .being {
    font-family: var(--display);
    font-size: 1.35rem;
    font-weight: 500;
    line-height: 1;
    min-height: 2.9rem;
    padding: .35rem .95rem .45rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    transition: background-color .18s ease, opacity .25s ease, border-color .18s ease;
  }
  .being[aria-pressed="true"] { background: var(--tint); border-color: transparent; color: var(--on-pastel); }
  .being:disabled { opacity: .3; cursor: default; }
  .guide {
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: .9rem 1.1rem 1rem;
    margin: 0 0 1.3rem;
  }
  .guide-title { font-weight: 600; font-size: .95rem; margin: 0 0 .45rem; }
  .guide ul { list-style: none; margin: 0; padding: 0; }
  .guide li { display: flex; align-items: baseline; gap: .6rem; font-size: .95rem; color: var(--muted); line-height: 1.55; }
  .guide li + li { margin-top: .15rem; }
  .guide li i { flex: none; width: .68rem; height: .68rem; border-radius: 50%; background: var(--t); transform: translateY(.05rem); }

  .principle {
    margin: 2rem 0 0;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .95rem;
  }

  .savebar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    background: var(--bar);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: .8rem 1.35rem calc(.8rem + env(safe-area-inset-bottom, 0px));
  }
  .savebar-in { max-width: 31.3rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: .7rem; }
  .count { font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .primary {
    white-space: nowrap;
    background: var(--ink);
    color: var(--bg);
    font-weight: 600;
    padding: .8rem 1.4rem;
    border-radius: 999px;
    min-height: 3rem;
    transition: opacity .2s ease;
  }
  .primary:disabled { opacity: .3; cursor: default; }
  .quiet-link { color: var(--muted); text-decoration: underline; text-underline-offset: .25em; min-height: 2.75rem; padding: 0 .2rem; }
  .row { display: flex; align-items: center; gap: 1rem; }

  /* today — orbital layout */
  .today-page {
    width: 100%; max-width: 34rem; margin: auto;
    padding: 1rem 1.35rem 1.5rem;
    display: flex; flex-direction: column; align-items: center;
  }
  .i-am { font-size: .98rem; color: var(--muted); margin: 0 0 .4rem; align-self: flex-start; }

  .orbit {
    --rs: clamp(78px, 21vw, 93px);
    --cs: clamp(96px, 27vw, 116px);
    --g: clamp(.38rem, 1.5vw, .55rem);
    display: grid;
    grid-template-columns: var(--rs) var(--cs) var(--rs);
    grid-template-rows: var(--rs) var(--cs) var(--rs);
    gap: var(--g);
    margin: .3rem auto 1rem;
  }
  .orb {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--tint);
    color: var(--on-pastel);
    border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .12s ease;
  }
  .orb:active { opacity: .68; }
  .orb-center {
    grid-column: 2; grid-row: 2;
    width: var(--cs); height: var(--cs);
    animation: orb-breathe 4.5s ease-in-out 0.8s infinite;
  }
  .orb-ring { width: var(--rs); height: var(--rs); }
  .orb-top    { grid-column: 2; grid-row: 1; animation: orb-pulse 5.3s ease-in-out 0.8s infinite; }
  .orb-right  { grid-column: 3; grid-row: 2; animation: orb-pulse 5.3s ease-in-out 2.2s infinite; }
  .orb-bottom { grid-column: 2; grid-row: 3; animation: orb-pulse 5.3s ease-in-out 3.6s infinite; }
  .orb-left   { grid-column: 1; grid-row: 2; animation: orb-pulse 5.3s ease-in-out 5.0s infinite; }
  .orb-active { outline: 2.5px solid var(--ink); outline-offset: 3px; }
  .orb-word {
    font-family: var(--display); font-weight: 500;
    font-size: clamp(.76rem, 2.4vw, .9rem);
    line-height: 1.2; padding: 0 .3rem;
    display: block; text-align: center;
  }
  .orb-center .orb-word { font-size: clamp(.9rem, 2.8vw, 1.06rem); }
  .orb-dot {
    display: block; width: 5px; height: 5px;
    border-radius: 50%; background: currentColor;
    opacity: .45; margin-top: .28rem;
  }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.08); }
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.05); }
  }

  /* note editing zone (below orbit) */
  .note-zone { width: 100%; max-width: 26rem; margin: 0 0 .5rem; animation: arrive .3s ease both; }
  .note-for { font-size: .93rem; color: var(--muted); margin: 0 0 .4rem; }
  .note-for strong { color: var(--ink); font-weight: 600; }
  .note-input {
    display: block; width: 100%;
    margin: 0 0 .7rem; padding: .7rem .8rem;
    font-size: 1rem; line-height: 1.5;
    background: var(--field); border: 1px solid var(--line);
    border-radius: 14px; direction: rtl; text-align: right; resize: vertical;
  }
  .note-actions { display: flex; gap: 1rem; align-items: center; }
  .note-actions .primary { padding: .55rem 1.2rem; min-height: 2.7rem; font-size: .98rem; }
  .day { font-size: .95rem; color: var(--muted); margin: .5rem 0 0; text-align: center; width: 100%; }
  .show-foot {
    display: flex; gap: 1.6rem; justify-content: center;
    padding: .9rem 0 .2rem; width: 100%;
    transition: opacity .4s ease;
  }
  .orbit, .being, .choice { animation: arrive .5s ease both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes arrive { from { opacity: 0; transform: translateY(.4rem); } to { opacity: 1; transform: none; } }

  body.quiet .top, body.quiet .show-foot { opacity: 0; pointer-events: none; }
  .wake { display: none; position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  body.quiet .wake { display: block; }

  /* log */
  .often { margin: 0 0 2rem; }
  .often h2, .month h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 .6rem; }
  .often ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .often li {
    font-family: var(--display);
    font-size: 1.2rem;
    font-weight: 500;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .2rem .8rem .3rem;
  }
  .often li span { font-family: var(--ui); font-size: .85rem; font-weight: 400; color: var(--muted); margin-inline-start: .35rem; font-variant-numeric: tabular-nums; }
  .month { margin: 0 0 1.6rem; }
  .month ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
  .month li { background: var(--field); border: 1px solid var(--line); border-radius: 20px; padding: .9rem 1.1rem 1rem; }
  .when { font-size: .9rem; color: var(--muted); margin: 0 0 .35rem; }
  .when b { font-weight: 600; color: var(--on-pastel); background: var(--p2); border-radius: 999px; padding: .05rem .55rem; margin-inline-start: .45rem; font-size: .8rem; }
  .what { font-family: var(--display); font-size: 1.25rem; font-weight: 500; line-height: 1.35; margin: 0; }
  .said { font-size: .95rem; line-height: 1.5; color: var(--muted); white-space: pre-wrap; margin: .05rem 0 .6rem; }
  .said:last-child { margin-bottom: 0; }
  .empty, .where { color: var(--muted); }
  .where { font-size: .9rem; margin: 2rem 0 0; }

  /* settings */
  .settings h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; color: var(--muted); margin: 1.8rem 0 .6rem; }
  .settings .choices { flex-direction: row; flex-wrap: wrap; }
  .settings .choice { width: auto; flex: 1 1 9rem; text-align: center; }

  /* sign in */
  .gate .nav { display: none; }
  .auth { margin: auto; }
  .input {
    display: block;
    width: 100%;
    margin: 0 0 .7rem;
    padding: .85rem 1rem;
    font-size: 1rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    direction: rtl;
    text-align: right;
  }
  .input:focus { outline: 2px solid var(--p5); outline-offset: 1px; }
  .auth .primary { width: 100%; }
  .auth-links { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; margin: 1.1rem 0 0; }
  .msg { margin: 0 0 .9rem; padding: .7rem .9rem; border-radius: 14px; background: var(--p1); color: var(--on-pastel); font-size: .95rem; }
  .msg.good { background: var(--p4); }
  .account { background: var(--field); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1.1rem 1rem; }
  .account p { margin: 0 0 .6rem; font-size: .95rem; }
  .account .who { font-weight: 600; }
  .spinner { margin: auto; text-align: center; color: var(--muted); }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .65rem;
    width: 100%;
    padding: .8rem 1.2rem;
    margin: 0 0 .8rem;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease;
  }
  .google-btn:hover { background: var(--bg); }
  .google-btn svg { flex: none; width: 1.25rem; height: 1.25rem; }
  .divider { display: flex; align-items: center; gap: .7rem; margin: .2rem 0 .8rem; color: var(--muted); font-size: .9rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .nojs { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.35rem; }

  @media (prefers-reduced-motion: reduce) {
    .orbit, .orb-center, .orb-ring, .being, .choice { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

  var DAY_STARTS_AT = 4; // a new day begins at 04:00, so a late night still belongs to the day before
  var K_DAYS = "havayot.days.v1";
  var K_SET = "havayot.settings.v1";
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  var app = document.getElementById("app");
  var navButtons = Array.prototype.slice.call(document.querySelectorAll(".nav button"));

  var state = {
    days: {},        // "YYYY-MM-DD" -> { beings: [..], notes: {being: text}, savedAt: iso }
    gender: null,    // "m" | "f", chosen once and changeable in settings
    picks: [null, null, null, null, null], // one slot per tone, so each of the five gets its own
    editing: false,
    noteFor: null,
    view: "today",
    user: null,          // the signed-in account, when there is one
    authKnown: !WANTS_CLOUD,
    cloudDown: false,
    authMode: "in",      // "in" | "up"
    busy: false,
    msg: null            // { text: "", good: false }
  };

  /* ---------- helpers ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(now) {
    var d = new Date((now || new Date()).getTime() - DAY_STARTS_AT * 3600 * 1000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function keyToDate(key) { var p = key.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(key, opts) {
    try { return new Intl.DateTimeFormat("he-IL", opts).format(keyToDate(key)); }
    catch (e) { return key; }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function t() { return TEXT[state.gender || "m"]; }
  function beings() { return LIST[state.gender || "m"]; }
  var GROUP = ["--p5", "--p4", "--p4", "--p2", "--p2"]; // breath, accessible, accessible, challenging, challenging
  function tintAt(slot) { return "var(" + (GROUP[slot] || "--p6") + ")"; }
  function emptyPicks() { return [null, null, null, null, null]; }
  function suggestedPicks() {   // the first slot starts filled; it can be freed like any other
    var picks = emptyPicks();
    picks[0] = beings()[BREATH];
    return picks;
  }
  function picked() { return state.picks.filter(Boolean); }
  function normalize(v) {
    if (!v || !Array.isArray(v.beings)) return null;
    var list = v.beings.filter(function (b) { return typeof b === "string" && b && b.length < 40; }).slice(0, MAX);
    if (!list.length) return null;
    var notes = {};
    if (v.notes && typeof v.notes === "object") {
      list.forEach(function (b) {
        var x = v.notes[b];
        if (typeof x === "string" && x.trim()) notes[b] = x.slice(0, 2000);
      });
    }
    return { beings: list, notes: notes, savedAt: typeof v.savedAt === "string" ? v.savedAt : "" };
  }

  /* ---------- the log and the settings live in this browser ---------- */
  function loadLocalSettings() {
    try {
    } catch (e) { /* private browsing, or storage turned off */ }
  }
  function load() {
    loadLocalSettings();
    try {
      var raw = localStorage.getItem(K_DAYS);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          Object.keys(parsed).forEach(function (k) {
            var e = normalize(parsed[k]);
            if (e && DATE_RE.test(k)) state.days[k] = e;
          });
        }
      }
      var set = JSON.parse(localStorage.getItem(K_SET) || "{}");
      if (set && (set.gender === "m" || set.gender === "f")) state.gender = set.gender;
    } catch (e) { /* private browsing, or storage turned off */ }
  }
  function mirror() {
    try { localStorage.setItem(K_DAYS, JSON.stringify(state.days)); } catch (e) { /* nothing to do */ }
  }
  function saveDays(key) {
    mirror();
    if (state.user && cloud.api && key && state.days[key]) cloud.api.putDay(key, state.days[key]);
  }
  function saveSettings() {
    try { localStorage.setItem(K_SET, JSON.stringify({ gender: state.gender })); } catch (e) { /* nothing to do */ }
    if (state.user && cloud.api) cloud.api.putSettings({ gender: state.gender });
  }

  /* ---------- actions ---------- */
  function setGender(g) {
    if (g !== "m" && g !== "f") return;
    var from = state.gender;
    state.gender = g;
    saveSettings();
    if (from && from !== g) translateAll(from, g);
    render(true);
  }
  // the two lists hold the same beings in the same order, so a day can move between them
  function translateAll(from, to) {
    var a = LIST[from], b = LIST[to];
    Object.keys(state.days).forEach(function (k) {
      var day = state.days[k], notes = {};
      day.beings = day.beings.map(function (w) {
        var i = a.indexOf(w);
        var out = i >= 0 ? b[i] : w;
        if (day.notes[w]) notes[out] = day.notes[w];
        return out;
      });
      day.notes = notes;
      if (state.user && cloud.api) cloud.api.putDay(k, day);
    });
    state.picks = state.picks.map(function (w) {
      if (!w) return null;
      var i = a.indexOf(w);
      return i >= 0 ? b[i] : w;
    });
    mirror();
  }

  function togglePick(name) {
    var at = state.picks.indexOf(name);
    if (at >= 0) state.picks[at] = null;      // freeing a slot leaves the other four on their tone
    else {
      var free = state.picks.indexOf(null);
      if (free < 0) return;
      state.picks[free] = name;
    }
    updateChoose();
  }
  function saveToday() {
    var list = picked();
    if (list.length !== MAX) return;
    var key = dayKey();
    var prev = state.days[key], kept = {};
    if (prev && prev.notes) list.forEach(function (b) { if (prev.notes[b]) kept[b] = prev.notes[b]; });
    state.days[key] = { beings: list, notes: kept, savedAt: new Date().toISOString() };
    saveDays(key);
    state.picks = emptyPicks();
    state.editing = false;
    render();
  }
  function startEdit() {
    var today = state.days[dayKey()];
    state.picks = emptyPicks();
    if (today) {
      today.beings.slice(0, MAX).forEach(function (b, i) {   // every being keeps the tone it has today
        if (beings().indexOf(b) >= 0) state.picks[i] = b;
      });
    }
    state.editing = true;
    state.noteFor = null;
    render();
  }
  function cancelEdit() { state.picks = emptyPicks(); state.editing = false; render(); }

  function openNote(being) {
    var today = state.days[dayKey()];
    if (!today || today.beings.indexOf(being) < 0) return;
    state.noteFor = being;
    render();
  }
  function closeNote() { state.noteFor = null; render(); }
  function saveNote() {
    var being = state.noteFor, box = app.querySelector(".note-input"), key = dayKey(), today = state.days[key];
    if (!being || !box || !today) return;
    var text = box.value.replace(/\s+$/, "").slice(0, 2000);
    if (!today.notes) today.notes = {};
    if (text.trim()) today.notes[being] = text;
    else delete today.notes[being];
    today.savedAt = new Date().toISOString();
    saveDays(key);
    state.noteFor = null;
    render();
  }

  /* ---------- what the Firebase module reports back ---------- */
  cloud.onUser = function (user) {
    var was = state.user && state.user.uid;
    state.user = user;
    state.authKnown = true;
    state.busy = false;
    state.view = "today";     // signing in or out always lands on today
    if (!user) {
      state.days = {};
      state.gender = null;
      state.picks = emptyPicks();
      loadLocalSettings();          // the wording stays, the days do not
    } else if (user.uid !== was) {
      state.msg = null;
    }
    render(true);
  };
  cloud.onDays = function (remote, firstTime) {
    var merged = {};
    Object.keys(remote).forEach(function (k) {
      var e = normalize(remote[k]);
      if (e && DATE_RE.test(k)) merged[k] = e;
    });
    if (firstTime) {                // days written before signing in move up to the account
      Object.keys(state.days).forEach(function (k) {
        var mine = state.days[k], there = merged[k];
        if (!there || (mine.savedAt || "") > (there.savedAt || "")) {
          merged[k] = mine;
          if (cloud.api) cloud.api.putDay(k, mine);
        }
      });
    }
    state.days = merged;
    mirror();
    render(true);
  };
  cloud.onSettings = function (set, firstTime) {
    if (set && (set.gender === "m" || set.gender === "f")) {
      state.gender = set.gender;
      try { localStorage.setItem(K_SET, JSON.stringify({ gender: state.gender })); } catch (e) { /* nothing to do */ }
    } else if (firstTime && state.gender && cloud.api) {
      cloud.api.putSettings({ gender: state.gender });
    }
    render(true);
  };
  cloud.onProblem = function (text) {
    state.busy = false;
    state.msg = { text: text, good: false };
    render(true);
  };
  cloud.onNotice = function (text) {
    state.busy = false;
    state.msg = { text: text, good: true };
    render(true);
  };
  cloud.onDown = function () {      // the module could not load or start
    state.cloudDown = true;
    state.authKnown = true;
    render(true);
  };

  /* ---------- account actions ---------- */
  function authGoogle() {
    if (!cloud.api) return;
    state.busy = true;
    state.msg = null;
    render(true);
    cloud.api.signInWithGoogle();
  }
  function authSubmit() {
    var mail = app.querySelector("#mail"), pass = app.querySelector("#pass");
    if (!mail || !pass || !cloud.api) return;
    var email = mail.value.trim(), password = pass.value;
    if (!email || !password) {
      state.msg = { text: "צריך למלא מייל וסיסמה.", good: false };
      return render(true);
    }
    state.busy = true;
    state.msg = null;
    render(true);
    if (state.authMode === "up") cloud.api.signUp(email, password);
    else cloud.api.signIn(email, password);
  }
  function authReset() {
    var mail = app.querySelector("#mail");
    if (!mail || !cloud.api) return;
    var email = mail.value.trim();
    if (!email) {
      state.msg = { text: "מלא קודם את כתובת המייל, ואז לחץ שוב.", good: false };
      return render(true);
    }
    state.busy = true;
    render(true);
    cloud.api.reset(email);
  }

  /* ---------- rendering ---------- */
  var screenKey = "";

  function render(force) {
    navButtons.forEach(function (b) {
      if (b.dataset.view === state.view && state.gender) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    var needsAuth = WANTS_CLOUD && !state.cloudDown;
    document.body.classList.toggle("gate", (needsAuth && !state.user) || !state.gender);

    var today = state.days[dayKey()];
    var key;
    if (needsAuth && !state.authKnown) key = "wait:";
    else if (needsAuth && !state.user) key = "auth:" + state.authMode + state.busy + JSON.stringify(state.msg);
    else if (!state.gender) key = "setup:";
    else if (state.view === "settings") key = "settings:" + state.gender + (state.user ? state.user.email : "-") + state.cloudDown;
    else if (state.view === "log") key = "log:" + state.gender + (state.user ? "u" : "-") + JSON.stringify(state.days);
    else if (today && !state.editing) key = "show:" + state.gender + today.beings.join("|") + JSON.stringify(today.notes) + state.noteFor;
    else key = "choose:" + state.gender + state.editing;

    if (key.indexOf("show:") !== 0) { document.body.classList.remove("quiet"); state.noteFor = null; }
    var sameScreen = screenKey.split(":")[0] === key.split(":")[0];
    if (!force && key === screenKey) { if (key.indexOf("choose:") === 0) updateChoose(); return; }
    screenKey = key;

    if (key.indexOf("wait:") === 0) app.innerHTML = '<section class="page spinner"><p>רגע, מתחבר לחשבון...</p></section>';
    else if (key.indexOf("auth:") === 0) renderAuth();
    else if (key.indexOf("setup:") === 0) renderSetup();
    else if (key.indexOf("settings:") === 0) renderSettings();
    else if (key.indexOf("log:") === 0) renderLog();
    else if (key.indexOf("show:") === 0) renderShow(today);
    else renderChoose();
    if (!sameScreen) app.scrollTop = 0;
  }

  function genderButtons() {
    return '<div class="choices">' +
      '<button type="button" class="choice" data-act="gender" data-gender="m" aria-pressed="' + (state.gender === "m") + '">בלשון זכר</button>' +
      '<button type="button" class="choice" data-act="gender" data-gender="f" aria-pressed="' + (state.gender === "f") + '">בלשון נקבה</button>' +
      "</div>";
  }

  function renderAuth() {
    var up = state.authMode === "up";
    var mail = "", pass = "";
    var oldMail = app.querySelector("#mail"), oldPass = app.querySelector("#pass");
    if (oldMail) mail = oldMail.value;
    if (oldPass) pass = oldPass.value;

    var googleSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';

    app.innerHTML = '<section class="page auth"><h1>' + (up ? "פתיחת חשבון" : "כניסה") + "</h1>" +
      '<p class="lede">' + (up
        ? "חשבון חדש שומר את הבחירות והמילים שלך, ומסנכרן אותן בין כל המכשירים."
        : "הבחירות והמילים שלך נשמרות בחשבון ונפתחות מכל מכשיר.") + "</p>" +
      (state.msg ? '<p class="msg' + (state.msg.good ? " good" : "") + '">' + esc(state.msg.text) + "</p>" : "") +
      '<button type="button" class="google-btn" data-act="auth-google"' + (state.busy ? " disabled" : "") + ">" +
      googleSvg + (state.busy ? "רגע..." : "המשך עם Google") + "</button>" +
      '<div class="divider">או</div>' +
      '<input class="input" id="mail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="כתובת מייל" value="' + esc(mail) + '">' +
      '<input class="input" id="pass" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '" placeholder="סיסמה" value="' + esc(pass) + '">' +
      '<button type="button" class="primary" data-act="auth-go"' + (state.busy ? " disabled" : "") + ">" +
      (state.busy ? "רגע..." : (up ? "פתח חשבון" : "כניסה עם מייל")) + "</button>" +
      '<div class="auth-links">' +
      '<button type="button" class="quiet-link" data-act="auth-mode">' + (up ? "כבר יש לי חשבון" : "אין לי חשבון עדיין") + "</button>" +
      (up ? "" : '<button type="button" class="quiet-link" data-act="auth-reset">שכחתי סיסמה</button>') +
      "</div></section>";

    var focusOn = app.querySelector(mail ? "#pass" : "#mail");
    if (focusOn && !state.busy) focusOn.focus();
  }

  function renderSetup() {
    app.innerHTML = '<section class="page setup"><h1>רגע לפני שמתחילים</h1>' +
      '<p class="lede">באיזו לשון לפנות אליך? אפשר לשנות את זה בכל רגע במסך ההגדרות.</p>' +
      genderButtons() + "</section>";
  }

  function renderSettings() {
    var account = "";
    if (state.user) {
      account = "<h2>החשבון שלך</h2><div class=\"account\">" +
        '<p class="who">' + esc(state.user.email || "מחובר") + "</p>" +
        '<button type="button" class="quiet-link" data-act="sign-out">יציאה מהחשבון</button></div>';
    }
    var where = state.user
      ? "הבחירה היומית והמילים נשמרות בחשבון שלך ומסונכרנות בין המכשירים. עותק נשמר גם בדפדפן הזה כדי שהכל יעבוד גם בלי רשת."
      : (state.cloudDown
        ? "החיבור לחשבון לא עלה כרגע, והנתונים נשמרים בדפדפן הזה בלבד."
        : "הבחירה היומית והמילים נשמרות בדפדפן הזה בלבד, על המכשיר שלך. מחיקת נתוני הדפדפן תמחק גם אותן.");

    app.innerHTML = '<section class="page settings"><h1>הגדרות</h1>' +
      "<h2>לשון פנייה</h2>" + genderButtons() +
      account +
      "<h2>איפה נשמרים הנתונים</h2>" +
      '<p class="lede">' + esc(where) + "</p></section>";
  }

  function renderChoose() {
    var key = dayKey();
    if (!state.editing && !picked().length) state.picks = suggestedPicks();
    var guide = '<div class="guide"><p class="guide-title">המלצה לבחירה</p><ul>' +
      '<li><i style="--t:var(--p5)"></i>הווית נשימה כברירת מחדל</li>' +
      '<li><i style="--t:var(--p4)"></i>שתי הוויות נגישות</li>' +
      '<li><i style="--t:var(--p2)"></i>שתי הוויות רצויות ומאתגרות</li></ul></div>';
    app.innerHTML = '<section class="page choose">' +
      "<h1>" + esc(t().ask) + "</h1>" +
      '<p class="lede">' + esc(fmt(key, { weekday: "long", day: "numeric", month: "long" })) + esc(t().lede) + "</p>" +
      guide +
      '<ul class="field">' +
      beings().map(function (b, i) {
        return '<li><button type="button" class="being" style="--i:' + (i % 12) +
          '" aria-pressed="false" data-being="' + esc(b) + '">' + esc(b) + "</button></li>";
      }).join("") +
      "</ul>" +
      '<p class="principle">' + esc(t().principle) + "</p>" +
      "</section>" +
      '<div class="savebar"><div class="savebar-in">' +
      '<span class="count" aria-live="polite"></span>' +
      '<div class="row">' +
      (state.editing ? '<button type="button" class="quiet-link" data-act="cancel">ביטול</button>' : "") +
      '<button type="button" class="primary" data-act="save">' + esc(t().save) + "</button>" +
      "</div></div></div>";
    updateChoose();
  }

  function updateChoose() {
    var n = picked().length, full = n >= MAX;
    Array.prototype.forEach.call(app.querySelectorAll(".being"), function (btn) {
      var at = state.picks.indexOf(btn.dataset.being);
      btn.setAttribute("aria-pressed", at >= 0 ? "true" : "false");
      if (at >= 0) btn.style.setProperty("--tint", tintAt(at));
      else btn.style.removeProperty("--tint");
      btn.disabled = full && at < 0;
    });
    var count = app.querySelector(".count");
    if (count) count.textContent = n + " מתוך " + MAX;
    var save = app.querySelector('[data-act="save"]');
    if (save) save.disabled = !full;
  }

  function renderShow(today) {
    var key = dayKey();
    var notes = today.notes || {};
    var ORBIT = ["center", "top", "right", "bottom", "left"];

    var orbs = today.beings.map(function (b, i) {
      var note = notes[b] || "";
      var pos = ORBIT[i] || "ring";
      var cls = "orb " + (i === 0 ? "orb-center" : "orb-ring orb-" + pos) + (state.noteFor === b ? " orb-active" : "");
      return '<button type="button" class="' + cls + '" style="--tint:' + tintAt(i) + ';--i:' + i + '" ' +
        'data-act="note-open" data-word="' + esc(b) + '" aria-label="' + esc(t().writeOn + b) + '">' +
        '<span class="orb-word">' + esc(b) + '</span>' +
        (note ? '<span class="orb-dot" aria-hidden="true"></span>' : '') +
        '</button>';
    }).join("");

    var noteHtml = "";
    if (state.noteFor) {
      var editNote = notes[state.noteFor] || "";
      noteHtml = '<div class="note-zone">' +
        '<p class="note-for">מילים על <strong>' + esc(state.noteFor) + '</strong></p>' +
        '<textarea class="note-input" rows="3" maxlength="2000" placeholder="' + esc(t().placeholder) + '">' + esc(editNote) + '</textarea>' +
        '<div class="note-actions">' +
        '<button type="button" class="primary" data-act="note-save">' + esc(t().saveNote) + '</button>' +
        '<button type="button" class="quiet-link" data-act="note-cancel">ביטול</button>' +
        '</div></div>';
    }

    app.innerHTML = '<section class="today-page">' +
      '<p class="i-am">היום אני</p>' +
      '<div class="orbit">' + orbs + '</div>' +
      noteHtml +
      '<p class="day">' + esc(fmt(key, { weekday: "long", day: "numeric", month: "long" })) + '</p>' +
      '<div class="show-foot">' +
      '<button type="button" class="quiet-link" data-act="edit">' + esc(t().edit) + '</button>' +
      '<button type="button" class="quiet-link" data-act="quiet">מסך נקי</button>' +
      '</div></section>';

    if (state.noteFor) {
      var box = app.querySelector(".note-input");
      if (box) {
        box.focus();
        try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) { /* older browsers */ }
        box.scrollIntoView({ block: "center" });
      }
    }
  }

  function renderLog() {
    var keys = Object.keys(state.days).sort().reverse();
    var todayKey = dayKey();
    var html = '<section class="page log"><h1>יומן</h1>';

    if (!keys.length) {
      html += '<p class="empty">' + esc(t().logEmpty) + "</p>";
    } else {
      if (keys.length >= 2) {
        var tally = {};
        keys.forEach(function (k) { state.days[k].beings.forEach(function (b) { tally[b] = (tally[b] || 0) + 1; }); });
        var top = Object.keys(tally).filter(function (b) { return tally[b] >= 2; })
          .sort(function (a, b) { return tally[b] - tally[a] || a.localeCompare(b, "he"); }).slice(0, 8);
        if (top.length) {
          html += '<div class="often"><h2>ההוויות שבחרת הכי הרבה, מתוך ' + keys.length + " ימים</h2><ul>" +
            top.map(function (b) {
              return "<li>" + esc(b) + "<span>" + tally[b] + "</span></li>";
            }).join("") + "</ul></div>";
        }
      }
      var month = "";
      keys.forEach(function (k) {
        var m = k.slice(0, 7);
        if (m !== month) {
          if (month) html += "</ol></div>";
          month = m;
          html += '<div class="month"><h2>' + esc(fmt(k, { month: "long", year: "numeric" })) + "</h2><ol>";
        }
        var day = state.days[k], dayNotes = day.notes || {};
        var written = day.beings.filter(function (b) { return dayNotes[b]; });
        html += '<li><p class="when">' + esc(fmt(k, { weekday: "long", day: "numeric", month: "long" })) +
          (k === todayKey ? "<b>היום</b>" : "") + "</p>";
        if (!written.length) {
          html += '<p class="what">' + esc(day.beings.join(", ")) + "</p>";
        } else {
          html += day.beings.map(function (b) {
            return '<p class="what">' + esc(b) + "</p>" +
              (dayNotes[b] ? '<p class="said">' + esc(dayNotes[b]) + "</p>" : "");
          }).join("");
        }
        html += "</li>";
      });
      html += "</ol></div>";
    }
    html += '<p class="where">' + (state.user ? "היומן נשמר בחשבון שלך." : "היומן נשמר בדפדפן הזה בלבד.") + "</p></section>";
    app.innerHTML = html;
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (ev) {
    var t2 = ev.target.closest("button");
    if (!t2) return;
    if (t2.dataset.being) return togglePick(t2.dataset.being);
    switch (t2.dataset.act) {
      case "gender": return setGender(t2.dataset.gender);
      case "auth-google": return authGoogle();
      case "auth-go": return authSubmit();
      case "auth-reset": return authReset();
      case "auth-mode":
        state.authMode = state.authMode === "up" ? "in" : "up";
        state.msg = null;
        return render(true);
      case "sign-out":
        if (cloud.api) cloud.api.signOut();
        return;
      case "note-open": return openNote(t2.dataset.word);
      case "note-save": return saveNote();
      case "note-cancel": return closeNote();
      case "save": return saveToday();
      case "cancel": return cancelEdit();
      case "edit": return startEdit();
      case "quiet":
        document.body.classList.add("quiet");
        document.querySelector(".wake").focus();
        return;
    }
  });
  app.addEventListener("keydown", function (ev) {
    if (ev.target.classList.contains("note-input") && ev.key === "Escape") { ev.preventDefault(); closeNote(); }
    if (ev.target.classList.contains("input") && ev.key === "Enter") { ev.preventDefault(); authSubmit(); }
  });
  document.querySelector(".wake").addEventListener("click", function () { document.body.classList.remove("quiet"); });
  navButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      if (!state.gender) return;
      state.view = b.dataset.view;
      if (state.view !== "today") { state.editing = false; state.picks = emptyPicks(); }
      render();
    });
  });

  /* a new morning resets the choice, even if the page stayed open */
  var lastKey = dayKey();
  function checkDay() {
    var k = dayKey();
    if (k === lastKey) return;
    lastKey = k;
    state.picks = emptyPicks();
    state.editing = false;
    state.noteFor = null;
    state.view = "today";
    render(true);
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
  window.addEventListener("focus", checkDay);

  load();
  render();
  if (WANTS_CLOUD) setTimeout(function () { if (!state.authKnown) cloud.onDown(); }, 9000);
})();
</script>

<script type="module">
  // Loaded only when a project is configured. It lives in its own module, so if the
  // network or the browser blocks it, the app above simply stays in local mode.
  var bridge = window.Havayot;
  if (bridge.configured) {
    try {
      var V = "https://www.gstatic.com/firebasejs/10.14.1/";
      var appMod = await import(V + "firebase-app.js");
      var authMod = await import(V + "firebase-auth.js");
      var dbMod = await import(V + "firebase-firestore.js");

      var app = appMod.initializeApp(bridge.config);
      var auth = authMod.getAuth(app);
      var db = dbMod.getFirestore(app);
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);

      var SAYS = {
        "auth/invalid-email": "כתובת המייל אינה תקינה.",
        "auth/missing-password": "צריך למלא סיסמה.",
        "auth/weak-password": "הסיסמה קצרה מדי, צריך שישה תווים לפחות.",
        "auth/email-already-in-use": "כבר קיים חשבון עם המייל הזה. אפשר להיכנס איתו.",
        "auth/invalid-credential": "מייל או סיסמה שגויים.",
        "auth/wrong-password": "מייל או סיסמה שגויים.",
        "auth/user-not-found": "לא נמצא חשבון עם המייל הזה.",
        "auth/too-many-requests": "יותר מדי ניסיונות. נסה שוב עוד כמה דקות.",
        "auth/network-request-failed": "אין חיבור לרשת כרגע.",
        "permission-denied": "אין הרשאה לקרוא או לכתוב. צריך לעדכן את כללי הגישה ב Firestore."
      };
      function say(err) {
        var code = err && (err.code || err.message) || "";
        bridge.onProblem(SAYS[code] || ("משהו השתבש: " + code));
      }

      var stopDays = null, stopSet = null;
      function watch(uid) {
        var first = { days: true, set: true };
        stopDays = dbMod.onSnapshot(dbMod.collection(db, "users", uid, "days"), function (snap) {
          var out = {};
          snap.forEach(function (d) { out[d.id] = d.data(); });
          bridge.onDays(out, first.days);
          first.days = false;
        }, say);
        stopSet = dbMod.onSnapshot(dbMod.doc(db, "users", uid), function (d) {
          bridge.onSettings(d.exists() ? d.data() : null, first.set);
          first.set = false;
        }, say);
      }
      function unwatch() {
        if (stopDays) stopDays();
        if (stopSet) stopSet();
        stopDays = stopSet = null;
      }

      bridge.api = {
        signInWithGoogle: function () {
          var provider = new authMod.GoogleAuthProvider();
          authMod.signInWithPopup(auth, provider).catch(say);
        },
        signIn: function (email, password) {
          authMod.signInWithEmailAndPassword(auth, email, password).catch(say);
        },
        signUp: function (email, password) {
          authMod.createUserWithEmailAndPassword(auth, email, password).catch(say);
        },
        reset: function (email) {
          authMod.sendPasswordResetEmail(auth, email)
            .then(function () { bridge.onNotice("נשלח אליך מייל לאיפוס הסיסמה."); })
            .catch(say);
        },
        signOut: function () { authMod.signOut(auth).catch(say); },
        putDay: function (key, day) {
          var uid = auth.currentUser && auth.currentUser.uid;
          if (!uid) return;
          dbMod.setDoc(dbMod.doc(db, "users", uid, "days", key), {
            date: key,
            beings: day.beings.slice(),
            notes: day.notes || {},
            savedAt: day.savedAt || new Date().toISOString()
          }).catch(say);
        },
        putSettings: function (set) {
          var uid = auth.currentUser && auth.currentUser.uid;
          if (!uid) return;
          dbMod.setDoc(dbMod.doc(db, "users", uid), set, { merge: true }).catch(say);
        }
      };

      authMod.onAuthStateChanged(auth, function (user) {
        unwatch();
        if (user) watch(user.uid);
        bridge.onUser(user ? { uid: user.uid, email: user.email } : null);
      });
    } catch (e) {
      bridge.onDown();
    }
  }
</script>
</body>
</html>
