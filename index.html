<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="בחירה יומית של חמש הוויות, עם מילים על איך מממשים אותן היום.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הוויות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1829" media="(prefers-color-scheme: dark)">
<title>הוויות</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F6;
    --ink: #35323C;
    --muted: #857F8C;
    --line: rgba(53, 50, 60, .13);
    --bar: rgba(250, 248, 246, .92);
    --field: #FFFFFF;
    --on-pastel: #35323C;
    --p1: #F7DCE1;
    --p2: #FAE4CE;
    --p3: #F5EFC9;
    --p4: #DCEBD9;
    --p5: #D6E6F2;
    --p6: #E4DEF2;

    --display: "Frank Ruhl Libre", "David Libre", "David", "Times New Roman", serif;
    --ui: "IBM Plex Sans Hebrew", "Arimo", "Arial Hebrew", Arial, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1829;
      --ink: #EDE8F2;
      --muted: #9890A2;
      --line: rgba(237, 232, 242, .15);
      --bar: rgba(28, 24, 41, .92);
      --field: #261E38;
      --on-pastel: #2A1E3A;
      --p1: #EAB8C4;
      --p2: #EAC8A8;
      --p3: #E0D8A0;
      --p4: #B8D4B0;
      --p5: #AACCDE;
      --p6: #C4B8DE;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1829;
    --ink: #EDE8F2;
    --muted: #9890A2;
    --line: rgba(237, 232, 242, .15);
    --bar: rgba(28, 24, 41, .92);
    --field: #261E38;
    --on-pastel: #2A1E3A;
    --p1: #EAB8C4;
    --p2: #EAC8A8;
    --p3: #E0D8A0;
    --p4: #B8D4B0;
    --p5: #AACCDE;
    --p6: #C4B8DE;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 1.0625rem;
    line-height: 1.55;
    direction: rtl;
    text-align: right;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .top {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    gap: 1rem;
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    padding: 1rem 1.35rem .5rem;
    transition: opacity .4s ease;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.3rem; margin: 0; }
  .nav { display: flex; gap: 1.15rem; flex-wrap: wrap; }
  .nav button {
    padding: .35rem 0;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    min-height: 2.5rem;
    font-size: .98rem;
  }
  .nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--p2); font-weight: 600; }

  #app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .page { width: 100%; max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.35rem 2.5rem; }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    line-height: 1.18;
    margin: .25rem 0 .6rem;
  }
  .lede { color: var(--muted); margin: 0 0 1.6rem; }

  /* setup */
  .setup { margin: auto; }
  .choices { display: flex; flex-direction: column; gap: .7rem; margin: 0 0 1.4rem; }
  .choice {
    display: block;
    width: 100%;
    padding: 1rem 1.2rem;
    border-radius: 18px;
    background: var(--p5);
    color: var(--on-pastel);
    font-size: 1.1rem;
    text-align: right;
    transition: transform .15s ease;
  }
  .choice + .choice { background: var(--p1); }
  .choice:active { transform: scale(.985); }
  .choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

  /* choose */
  .choose { padding-bottom: 8rem; }
  .field { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  .being {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    font-family: var(--display);
    font-size: 1.35rem;
    font-weight: 500;
    line-height: 1;
    min-height: 2.9rem;
    padding: .35rem .95rem .45rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    transition: background-color .18s ease, opacity .25s ease, border-color .18s ease;
  }
  .being[aria-pressed="true"] { background: var(--tint); border-color: transparent; color: var(--on-pastel); }
  .being:disabled { opacity: .3; cursor: default; }
  .being .mk { flex: none; width: 1.05rem; height: 1.05rem; opacity: .5; }
  .being[aria-pressed="true"] .mk { opacity: 1; }
  .guide {
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: .9rem 1.1rem 1rem;
    margin: 0 0 1.3rem;
  }
  .guide-title { font-weight: 600; font-size: .95rem; margin: 0 0 .45rem; }
  .guide ul { list-style: none; margin: 0; padding: 0; }
  .guide li { display: flex; align-items: baseline; gap: .6rem; font-size: .95rem; color: var(--muted); line-height: 1.55; }
  .guide li + li { margin-top: .15rem; }
  .guide li i { flex: none; width: .68rem; height: .68rem; border-radius: 50%; background: var(--t); transform: translateY(.05rem); }

  .principle {
    margin: 2rem 0 0;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .95rem;
  }

  .savebar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    background: var(--bar);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: .8rem 1.35rem calc(.8rem + env(safe-area-inset-bottom, 0px));
  }
  .savebar-in { max-width: 31.3rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: .7rem; }
  .count { font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .primary {
    white-space: nowrap;
    background: var(--ink);
    color: var(--bg);
    font-weight: 600;
    padding: .8rem 1.4rem;
    border-radius: 999px;
    min-height: 3rem;
    transition: opacity .2s ease;
  }
  .primary:disabled { opacity: .3; cursor: default; }
  .quiet-link { color: var(--muted); text-decoration: underline; text-underline-offset: .25em; min-height: 2.75rem; padding: 0 .2rem; }
  .row { display: flex; align-items: center; gap: 1rem; }

  /* today — card layout */
  .today-page {
    width: 100%; max-width: 34rem; margin: auto;
    padding: 1rem 1.35rem 1.5rem;
    display: flex; flex-direction: column;
  }
  .today-date {
    font-size: .82rem; color: var(--muted);
    margin: 0 0 .7rem; align-self: flex-end;
  }
  .being-list { list-style: none; margin: 0 0 .8rem; padding: 0; display: flex; flex-direction: column; gap: .55rem; }
  .being-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: .9rem 1.1rem 1rem;
    border-radius: 18px;
    background: var(--tint);
    color: var(--on-pastel);
    text-align: right;
    cursor: pointer;
    border: none;
    transition: opacity .12s ease;
  }
  .being-txt { flex: 1 1 auto; min-width: 0; }
  .being-card > .mk { flex: none; width: 28px; height: 28px; opacity: .7; }
  .being-card:active { opacity: .7; }
  .being-card-active { outline: 2.5px solid var(--ink); outline-offset: 2px; }
  .being-name { font-family: var(--display); font-weight: 500; font-size: 1.25rem; display: block; }
  .being-hint {
    font-size: .88rem; opacity: .68; margin-top: .22rem;
    line-height: 1.4;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
    overflow: hidden;
    overflow-wrap: anywhere; word-break: break-word;
  }

  /* note editing zone */
  .note-zone { margin: 0 0 .5rem; animation: arrive .3s ease both; }
  .note-for { font-size: .93rem; color: var(--muted); margin: 0 0 .4rem; }
  .note-for strong { color: var(--ink); font-weight: 600; }
  .note-input {
    display: block; width: 100%;
    margin: 0 0 .7rem; padding: .7rem .8rem;
    font-size: 1rem; line-height: 1.5;
    background: var(--field); border: 1px solid var(--line);
    border-radius: 14px; direction: rtl; text-align: right; resize: vertical;
  }
  .note-actions { display: flex; gap: 1rem; align-items: center; }
  .note-actions .primary { padding: .55rem 1.2rem; min-height: 2.7rem; font-size: .98rem; }
  .day { display: none; }
  .show-foot {
    display: flex; gap: 1.6rem; justify-content: center;
    padding: .9rem 0 .2rem; width: 100%;
    transition: opacity .4s ease;
  }
  .being-card, .being, .choice { animation: arrive .5s ease both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes arrive { from { opacity: 0; transform: translateY(.4rem); } to { opacity: 1; transform: none; } }

  body.quiet .top, body.quiet .show-foot { opacity: 0; pointer-events: none; }
  .wake { display: none; position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  body.quiet .wake { display: block; }

  /* log */
  .often { margin: 0 0 2rem; }
  .often h2, .month h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 .6rem; }
  .often ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .often li {
    font-family: var(--display);
    font-size: 1.2rem;
    font-weight: 500;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .2rem .8rem .3rem;
  }
  .often li span { font-family: var(--ui); font-size: .85rem; font-weight: 400; color: var(--muted); margin-inline-start: .35rem; font-variant-numeric: tabular-nums; }
  .month { margin: 0 0 1.6rem; }
  .month ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
  .month li { background: var(--field); border: 1px solid var(--line); border-radius: 20px; padding: .9rem 1.1rem 1rem; }
  .when { font-size: .9rem; color: var(--muted); margin: 0 0 .35rem; }
  .when b { font-weight: 600; color: var(--on-pastel); background: var(--p2); border-radius: 999px; padding: .05rem .55rem; margin-inline-start: .45rem; font-size: .8rem; }
  .what { font-family: var(--display); font-size: 1.25rem; font-weight: 500; line-height: 1.35; margin: 0; }
  .said { font-size: .95rem; line-height: 1.5; color: var(--muted); white-space: pre-wrap; margin: .05rem 0 .6rem; }
  .said:last-child { margin-bottom: 0; }
  .empty, .where { color: var(--muted); }
  .where { font-size: .9rem; margin: 2rem 0 0; }

  /* Clearday */
  .cd { padding-bottom: 3rem; }
  .cd .lede { margin-bottom: 1rem; }
  .cd-open {
    background: var(--p5);
    color: var(--on-pastel);
    border-radius: 18px;
    padding: .85rem 1.1rem;
    margin: 0 0 1.6rem;
    font-size: .97rem;
    line-height: 1.55;
  }
  .cd-list { list-style: none; margin: 0; padding: 0; }
  .cd-item + .cd-item { margin-top: 1.5rem; }
  .cd-q {
    font-family: var(--display);
    font-size: 1.18rem;
    font-weight: 500;
    line-height: 1.4;
    margin: 0 0 .5rem;
  }
  .cd-n {
    display: inline-block;
    min-width: 1.5rem;
    color: var(--muted);
    font-family: var(--ui);
    font-size: .9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cd-hint {
    display: block;
    margin-inline-start: 1.5rem;
    font-family: var(--ui);
    font-size: .85rem;
    font-weight: 400;
    color: var(--muted);
  }
  .cd-box {
    display: block;
    width: 100%;
    min-height: 3.25rem;
    padding: .7rem .85rem;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    direction: rtl;
    text-align: right;
    resize: none;
    overflow: hidden;
  }
  .cd-box:focus { outline: 2px solid var(--p5); outline-offset: 1px; }
  .cd-beings { list-style: none; margin: 0 0 .5rem; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .cd-beings li {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: var(--tint);
    color: var(--on-pastel);
    border-radius: 999px;
    padding: .3rem .85rem .35rem;
    font-family: var(--display);
    font-size: 1.1rem;
  }
  .cd-beings .mk { width: .95rem; height: .95rem; opacity: .75; }
  .cd-empty { color: var(--muted); font-size: .95rem; margin: 0; }
  .cd-foot { color: var(--muted); font-size: .9rem; margin: 2.2rem 0 0; }

  .cd-more {
    display: inline-block;
    margin-top: .7rem;
    padding: .35rem .8rem .4rem;
    background: var(--p5);
    color: var(--on-pastel);
    border-radius: 999px;
    font-size: .88rem;
  }
  .cd-read { margin-top: .7rem; padding-top: .3rem; border-top: 1px solid var(--line); }
  .cd-rq { font-size: .88rem; color: var(--muted); margin: .7rem 0 .1rem; }
  .what.quiet { font-family: var(--ui); font-size: .95rem; color: var(--muted); font-weight: 400; }

  /* settings */
  .settings h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; color: var(--muted); margin: 1.8rem 0 .6rem; }
  .settings .choices { flex-direction: row; flex-wrap: wrap; }
  .settings .choice { width: auto; flex: 1 1 9rem; text-align: center; }
  .settings .themes .choice { flex: 1 1 6rem; font-size: 1rem; padding: .85rem .8rem; }
  .settings .themes .choice:nth-child(1) { background: var(--p4); }
  .settings .themes .choice:nth-child(2) { background: var(--p3); }
  .settings .themes .choice:nth-child(3) { background: var(--p6); }
  .settings .marks .choice:nth-child(1) { background: var(--p5); }
  .settings .marks .choice:nth-child(2) { background: var(--p1); }
  .lede.small { font-size: .9rem; margin: .7rem 0 0; }

  /* sign in */
  .gate .nav { display: none; }
  .auth { margin: auto; }
  .input {
    display: block;
    width: 100%;
    margin: 0 0 .7rem;
    padding: .85rem 1rem;
    font-size: 1rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    direction: rtl;
    text-align: right;
  }
  .input:focus { outline: 2px solid var(--p5); outline-offset: 1px; }
  .auth .primary { width: 100%; }
  .auth-links { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; margin: 1.1rem 0 0; }
  .msg { margin: 0 0 .9rem; padding: .7rem .9rem; border-radius: 14px; background: var(--p1); color: var(--on-pastel); font-size: .95rem; }
  .msg.good { background: var(--p4); }
  .account { background: var(--field); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1.1rem 1rem; }
  .account p { margin: 0 0 .6rem; font-size: .95rem; }
  .account .who { font-weight: 600; }
  .spinner { margin: auto; text-align: center; color: var(--muted); }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .65rem;
    width: 100%;
    padding: .8rem 1.2rem;
    margin: 0 0 .8rem;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease;
  }
  .google-btn:hover { background: var(--bg); }
  .google-btn svg { flex: none; width: 1.25rem; height: 1.25rem; }
  .divider { display: flex; align-items: center; gap: .7rem; margin: .2rem 0 .8rem; color: var(--muted); font-size: .9rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .nojs { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.35rem; }

  @media (prefers-reduced-motion: reduce) {
    .being-card, .being, .choice { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

  <nav class="nav" aria-label="ניווט">

    <button type="button" data-view="log">יומן</button>
    <button type="button" data-view="settings">הגדרות</button>

<main id="app"></main>

    state.noteFor = being;
    render();
  }
  function closeNote() { state.noteFor = null; render(); }
  function saveNote() {
    var being = state.noteFor, box = app.querySelector(".note-input"), key = dayKey(), today = state.days[key];
    if (!being || !box || !today) return;
    var text = box.value.replace(/\s+$/, "").slice(0, 2000);
    if (!today.notes) today.notes = {};
    if (text.trim()) today.notes[being] = text;
    else delete today.notes[being];
    today.savedAt = new Date().toISOString();
    saveDays(key);
    state.noteFor = null;
    render();
  }

  /* ---------- what the Firebase module reports back ---------- */
  cloud.onUser = function (user) {
    var was = state.user && state.user.uid;
    state.user = user;
    state.authKnown = true;
    state.busy = false;
    state.view = "today";     // signing in or out always lands on today
    if (!user) {
      if (localOwner()) forgetLocalDays(); // no one is signed in, so no account's days stay in this browser
      state.days = {};
      state.gender = null;
      state.picks = emptyPicks();
      wall = { key: "", blob: null, file: null };
      loadLocalSettings();          // the wording stays, the days do not
    } else if (user.uid !== was) {
      state.msg = null;
    }
    render(true);
  };
  cloud.onDays = function (remote, firstTime) {
    var merged = {};
    Object.keys(remote).forEach(function (k) {
      var e = normalize(remote[k]);
      if (e && DATE_RE.test(k)) merged[k] = e;
    });
    var owner = localOwner();       // days written before signing in move up to the account,
    if (firstTime && (!owner || (state.user && owner === state.user.uid))) { // never another account's
      Object.keys(state.days).forEach(function (k) {
        var mine = state.days[k], there = merged[k];
        if (!there || (mine.savedAt || "") > (there.savedAt || "")) {
          merged[k] = mine;
          if (cloud.api) cloud.api.putDay(k, mine);
        }
      });
    }
    // an answer being typed right now must not be wiped by an echo of an earlier save
    if (cdPending && state.days[cdPending]) {
      var live = state.days[cdPending], onServer = merged[cdPending];
      if (!onServer || (live.savedAt || "") > (onServer.savedAt || "")) merged[cdPending] = live;
    }
    state.days = merged;
    mirror();
    render(true);
  };
  cloud.onSettings = function (set, firstTime) {
    if (set && typeof set.marks === "boolean") state.marks = set.marks;
    if (set && THEMES.indexOf(set.theme) >= 0 && set.theme !== state.theme) {
      state.theme = set.theme;
      applyTheme();
    }
    if (set && (set.gender === "m" || set.gender === "f")) {
      state.gender = set.gender;
      try { localStorage.setItem(K_SET, JSON.stringify({ gender: state.gender, theme: state.theme, marks: state.marks })); } catch (e) { /* nothing to do */ }
    } else if (firstTime && state.gender && cloud.api) {
      cloud.api.putSettings({ gender: state.gender, theme: state.theme, marks: state.marks });
    }
    render(true);
  };
  cloud.onProblem = function (text) {
    state.busy = false;
    state.msg = { text: text, good: false };
    render(true);
  };
  cloud.onNotice = function (text) {
    state.busy = false;
    state.msg = { text: text, good: true };
    render(true);
  };
  cloud.onDown = function () {      // the module could not load or start
    state.cloudDown = true;
    state.authKnown = true;
    render(true);
  };

  /* ---------- account actions ---------- */
  function authGoogle() {
    if (!cloud.api) return;
    state.busy = true;
    state.msg = null;
    render(true);
    cloud.api.signInWithGoogle();
  }
  function authSubmit() {
    var mail = app.querySelector("#mail"), pass = app.querySelector("#pass");
    if (!mail || !pass || !cloud.api) return;
    var email = mail.value.trim(), password = pass.value;
    if (!email || !password) {
      state.msg = { text: "צריך למלא מייל וסיסמה.", good: false };
      return render(true);
    }
    state.busy = true;
    state.msg = null;
    render(true);
    if (state.authMode === "up") cloud.api.signUp(email, password);
    else cloud.api.signIn(email, password);
  }
  function authReset() {
    var mail = app.querySelector("#mail");
    if (!mail || !cloud.api) return;
    var email = mail.value.trim();
    if (!email) {
      state.msg = { text: "מלא קודם את כתובת המייל, ואז לחץ שוב.", good: false };
      return render(true);
    }
    state.busy = true;
    render(true);
    cloud.api.reset(email);
  }

  /* ---------- Clearday ---------- */
  var cdTimer = null, cdPending = null, cdFocus = null;

  function cdAnswers() {
    var day = state.days[dayKey()];
    return (day && day.clearday) || {};
  }
  // typing writes locally at once and reaches the account a moment after the last keystroke
  function cdType(id, text) {
    var key = dayKey();
    var day = state.days[key];
    if (!day) day = state.days[key] = { beings: [], notes: {}, clearday: {}, savedAt: new Date().toISOString() };
    if (!day.clearday) day.clearday = {};
    text = text.slice(0, 4000);
    if (text.trim()) day.clearday[id] = text;
    else delete day.clearday[id];
    day.savedAt = new Date().toISOString();
    mirror();
    cdPending = key;
    clearTimeout(cdTimer);
    cdTimer = setTimeout(cdFlush, 1200);
  }
  function cdFlush() {
    clearTimeout(cdTimer);
    var key = cdPending;
    cdPending = null;
    if (key && state.user && cloud.api && state.days[key]) cloud.api.putDay(key, state.days[key]);
  }
  // nothing is lost when the page is closed or hidden mid-sentence
  document.addEventListener("visibilitychange", function () { if (document.hidden) cdFlush(); });
  window.addEventListener("pagehide", cdFlush);

  function grow(box) {
    box.style.height = "auto";
    box.style.height = Math.max(box.scrollHeight, 52) + "px";
  }

  /* ---------- rendering ---------- */
  var screenKey = "";

  function render(force) {
    clearTimeout(window._autoQuiet);
    navButtons.forEach(function (b) {
      if (b.dataset.view === state.view && state.gender) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    var needsAuth = WANTS_CLOUD && !state.cloudDown;
    document.body.classList.toggle("gate", (needsAuth && !state.user) || !state.gender);

    var today = state.days[dayKey()];
    var key;
    if (needsAuth && !state.authKnown) key = "wait:";
    else if (needsAuth && !state.user) key = "auth:" + state.authMode + state.busy + JSON.stringify(state.msg);
    else if (!state.gender) key = "setup:";
    else if (state.view === "clearday") key = "clearday:" + state.marks + state.gender +
      ((today && today.beings) || []).join("|") + Object.keys(((today && today.clearday) || {})).join(",");
    else if (state.view === "settings") key = "settings:" + state.gender + state.theme + state.marks + (state.user ? state.user.email : "-") + state.cloudDown;
    else if (state.view === "log") key = "log:" + state.gender + (state.user ? "u" : "-") +
      JSON.stringify(state.openDays) + JSON.stringify(state.days);
    else if (today && today.beings.length && !state.editing) key = "show:" + state.marks + state.gender + today.beings.join("|") + JSON.stringify(today.notes) + state.noteFor;
    else key = "choose:" + state.marks + state.gender + state.editing;

    if (key.indexOf("show:") !== 0) { document.body.classList.remove("quiet"); state.noteFor = null; }
    var sameScreen = screenKey.split(":")[0] === key.split(":")[0];
    if (!force && key === screenKey) { if (key.indexOf("choose:") === 0) updateChoose(); return; }
    screenKey = key;

    if (key.indexOf("clearday:") === 0) {
      var on = document.activeElement;
      if (on && on.classList && on.classList.contains("cd-box")) {
        cdFocus = { q: on.dataset.q, at: on.selectionStart };
      }
      renderClearday();
    }
    else if (key.indexOf("wait:") === 0) app.innerHTML = '<section class="page spinner"><p>רגע, מתחבר לחשבון...</p></section>';
    else if (key.indexOf("auth:") === 0) renderAuth();
    else if (key.indexOf("setup:") === 0) renderSetup();
    else if (key.indexOf("settings:") === 0) renderSettings();
    else if (key.indexOf("log:") === 0) renderLog();
    else if (key.indexOf("show:") === 0) renderShow(today);
    else renderChoose();
    if (!sameScreen) app.scrollTop = 0;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /* ---------- the wallpaper ----------
     the image is drawn ahead of time, so a tap on the button hands it to the share
     sheet at once, while the tap still counts as the person's own action.
     the cards keep to the part of the lock screen that stays clear in every case:
     right under the clock, above the flashlight and camera, and inside the frame that
     stays on screen when iOS shows the picture enlarged (Spatial Scene, Perspective Zoom).
     on the phone this was measured on, iOS enlarged it 1.19 times, kept the top edge in
     place and pinned one side to the screen's edge; the layout allows for either side.
     all in CSS pixels, which are the same as iOS points. */
  var WALL_CLOCK = 212;    // the clock ends this far below the top edge
  var WALL_BUTTONS = 114;  // the flashlight and camera start this far above the bottom edge
  var WALL_AIR = 14;       // space kept from the clock, the buttons and the screen's sides
  var WALL_ZOOM = 1.2;     // the enlargement the layout survives; 1 turns the allowance off
  var WALL_TITLE_FONT = '"Frank Ruhl Libre", "David Libre", Georgia, serif';
  var WALL_NOTE_FONT = '"IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif';
  var wall = { key: "", blob: null, file: null };
  var wallTimer = null;

  function darkScheme() {
    return true;   // the wallpaper sits on the lock screen at night, so it is drawn dark whatever the phone is set to
  }
  function wallKey(today) {
    return [dayKey(), "d", state.marks ? "m" : "-", window.screen.width, window.screen.height,
      window.devicePixelRatio || 2, today.beings.join("|"), JSON.stringify(today.notes || {})].join("~");
  }

  // the canvas draws with whatever font is ready, so both are asked for first, for at most a second and a half
  function wallFonts() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var sample = "אבגabc";
    var ready = Promise.all([
      document.fonts.load("700 20px " + WALL_TITLE_FONT, sample),
      document.fonts.load("400 13px " + WALL_NOTE_FONT, sample)
    ]).catch(function () { /* the fallback fonts will do */ });
    return Promise.race([ready, new Promise(function (done) { setTimeout(done, 1500); })]);
  }

  // breaks on spaces, and inside a single word that is longer than one line
  function wrapLines(ctx, text, maxW) {
    var out = [], cur = "";
    String(text).split(/\s+/).forEach(function (w) {
      if (!w) return;
      if (ctx.measureText(w).width > maxW) {
        if (cur) { out.push(cur); cur = ""; }
        var chunk = "";
        Array.from(w).forEach(function (ch) {   // by code point, so an emoji is never split in two
          if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
          else chunk += ch;
        });
        cur = chunk;
        return;
      }
      var test = cur ? cur + " " + w : w;
      if (cur && ctx.measureText(test).width > maxW) { out.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) out.push(cur);
    return out;
  }

  // every card is as tall as its own words: a being without a note does not
  // take the room a long note needs, which is what lets every word fit
  function wallLayout(ctx, today, W, colW, s) {
    var notes = today.notes || {};
    var m = {
      title: 21 * s, note: 13.5 * s, lineH: 18.5 * s,
      padY: 13 * s, sep: 11 * s, gap: 10 * s, innerX: 16, markGap: 12,
      date: 13 * (W / 390) * Math.max(s, 0.85)   // the same size as before on every screen
    };
    m.titleH = m.title * 1.25;
    m.mark = state.marks ? m.title * 1.3 : 0;
    m.dateH = m.date * 1.5 + m.gap;
    var noteW = colW - m.innerX * 2 - (m.mark ? m.mark + m.markGap : 0);
    ctx.font = m.note + "px " + WALL_NOTE_FONT;
    var total = m.dateH;
    var cards = today.beings.map(function (b, i) {
      var lines = notes[b] ? wrapLines(ctx, notes[b], noteW) : [];
      var body = m.titleH + (lines.length ? m.sep + lines.length * m.lineH : 0);
      total += body + m.padY * 2 + (i ? m.gap : 0);
      return { being: b, lines: lines, body: body, cut: false };
    });
    return { m: m, cards: cards, total: total, noteW: noteW };
  }

  // a last resort for notes longer than the text box allows (older ones, or ones from elsewhere)
  function clipLayout(ctx, plan, room) {
    var m = plan.m;
    while (plan.total > room) {
      var big = null;
      plan.cards.forEach(function (c) { if (c.lines.length > 1 && (!big || c.lines.length > big.lines.length)) big = c; });
      if (!big) break;
      big.lines.pop();
      big.cut = true;
      big.body -= m.lineH;
      plan.total -= m.lineH;
    }
    ctx.font = m.note + "px " + WALL_NOTE_FONT;
    plan.cards.forEach(function (c) {
      if (!c.cut) return;
      var last = Array.from(c.lines[c.lines.length - 1]);
      while (last.length > 1 && ctx.measureText(last.join("") + "…").width > plan.noteW) last.pop();
      c.lines[c.lines.length - 1] = last.join("") + "…";
    });
  }

  function drawWallpaper(today) {
    var dark = darkScheme();
    var bg = dark ? "#1C1829" : "#FAF8F6";
    var muteClr = dark ? "#9890A2" : "#857F8C";
    var cardTxt = dark ? "#2A1E3A" : "#35323C";
    var noteClr = dark ? "rgba(42,30,58,0.72)" : "rgba(53,50,60,0.62)";
    var sepClr = "rgba(53,50,60,0.12)";
    var COLORS = dark
      ? ["#AACCDE", "#B8D4B0", "#B8D4B0", "#EAC8A8", "#EAC8A8"]
      : ["#D6E6F2", "#DCEBD9", "#DCEBD9", "#FAE4CE", "#FAE4CE"];
    var fallback = dark ? "#C4B8DE" : "#E4DEF2";

    var dpr = window.devicePixelRatio || 2;
    var W = window.screen.width, H = window.screen.height;
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);
    ctx.direction = "rtl";          // Hebrew with punctuation or numbers keeps its order
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    // the frame that stays clear with and without the enlargement; on an unusually short
    // screen the clock and buttons give a little
    var z = Math.max(1, WALL_ZOOM);
    var top = Math.min(WALL_CLOCK, H * 0.25) + WALL_AIR;                   // right under the clock
    var bottom = (H - Math.min(WALL_BUTTONS, H * 0.15) - WALL_AIR) / z;   // the top stays, so enlarging pushes down
    var left = W - W / z + WALL_AIR / z;                                   // clear whichever side iOS pins
    var right = (W - WALL_AIR) / z;
    var colW = right - left, room = bottom - top;

    // the largest type at which every word of every note fits, with nothing cut
    var plan = null;
    for (var step = 0; step <= 18; step++) {
      plan = wallLayout(ctx, today, W, colW, 1 - step * 0.025);
      if (plan.total <= room) break;
    }
    if (plan.total > room) clipLayout(ctx, plan, room);

    var m = plan.m, n = plan.cards.length;
    var grow = Math.max(0, Math.min((room - plan.total) / n, 44)); // spare room becomes air inside the cards
    var y = top;

    ctx.fillStyle = muteClr;
    ctx.font = m.date + "px " + WALL_NOTE_FONT;
    ctx.fillText(fmt(dayKey(), { weekday: "long", day: "numeric", month: "long" }), right, y + m.date * 0.75);
    y += m.dateH;

    var xRight = right - m.innerX;
    var xText = left + m.innerX + (m.mark ? m.mark + m.markGap : 0);
    plan.cards.forEach(function (c, i) {
      var h = c.body + m.padY * 2 + grow;
      ctx.fillStyle = COLORS[i] || fallback;
      roundRect(ctx, left, y, colW, h, 14);
      ctx.fill();

      if (m.mark) drawMark(ctx, c.being, left + m.innerX, y + (h - m.mark) / 2, m.mark, cardTxt);

      var at = y + (h - c.body) / 2;   // name, rule and note sit as one block in the middle of the card
      ctx.fillStyle = cardTxt;
      ctx.font = "bold " + m.title + "px " + WALL_TITLE_FONT;
      ctx.fillText(c.being, xRight, at + m.titleH / 2);

      if (c.lines.length) {
        var ruleY = at + m.titleH + m.sep / 2;
        ctx.strokeStyle = sepClr;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(xText, ruleY);
        ctx.lineTo(xRight, ruleY);
        ctx.stroke();

        ctx.fillStyle = noteClr;
        ctx.font = m.note + "px " + WALL_NOTE_FONT;
        var noteTop = at + m.titleH + m.sep;
        c.lines.forEach(function (line, li) {
          ctx.fillText(line, xRight, noteTop + li * m.lineH + m.lineH / 2);
        });
      }
      y += h + m.gap;
    });
    return canvas;
  }

  function prepareWallpaper(today, done) {
    if (!today || !today.beings || !today.beings.length) return;
    var key = wallKey(today);
    if (wall.key === key && wall.blob) { if (done) done(wall); return; }
    wallFonts().then(function () {
      drawWallpaper(today).toBlob(function (blob) {
        if (!blob) return;
        var file = null;
        try { file = new File([blob], "havayot.png", { type: "image/png" }); } catch (e) { /* older browsers: the overlay still works */ }
        wall = { key: key, blob: blob, file: file };
        if (done) done(wall);
      }, "image/png");
    });
  }

  function scheduleWallpaper() {
    clearTimeout(wallTimer);
    wallTimer = setTimeout(function () {
      if (screenKey.indexOf("show:") === 0) prepareWallpaper(state.days[dayKey()]);
    }, 400);
  }

  function saveWallpaper(today) {
    // usually ready already, so the share sheet opens within the tap itself
    prepareWallpaper(today, deliverWallpaper);
  }

  function deliverWallpaper(w) {
    if (w.file && navigator.share && navigator.canShare && navigator.canShare({ files: [w.file] })) {
      /* the native share sheet first (on iOS, a Shortcut can be a target) */
      navigator.share({ files: [w.file], title: "הוויות היום" }).catch(function (err) {
        var name = err && err.name;
        if (name !== "AbortError" && name !== "InvalidStateError") showWallpaper(w.blob); // refused, not cancelled
      });
      return;
    }
    showWallpaper(w.blob);
  }

  /* the fallback: the image on its own, so a long press can save it */
  function showWallpaper(blob) {
    var url = URL.createObjectURL(blob);
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1.2rem;";

    var img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.style.cssText = "max-width:100%;max-height:72vh;border-radius:16px;object-fit:contain;box-shadow:0 8px 32px rgba(0,0,0,.5);";

    var hint = document.createElement("p");
    hint.textContent = t().wallHint;
    hint.style.cssText = "color:#fff;margin:0;text-align:center;font-size:1rem;opacity:.9;";

    var closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.textContent = t().wallClose;
    closeBtn.style.cssText = "color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.5rem 2rem;font-size:1rem;cursor:pointer;font-family:inherit;";
    closeBtn.onclick = function () { document.body.removeChild(overlay); URL.revokeObjectURL(url); };

    overlay.appendChild(img);
    overlay.appendChild(hint);
    overlay.appendChild(closeBtn);
    document.body.appendChild(overlay);
    closeBtn.focus();
  }

  function renderLog() {
    var keys = Object.keys(state.days).sort().reverse();
    var todayKey = dayKey();
    var html = '<section class="page log"><h1>יומן</h1>';

    if (!keys.length) {
      html += '<p class="empty">' + esc(t().logEmpty) + "</p>";
    } else {
      if (keys.length >= 2) {
        var tally = {};
        keys.forEach(function (k) { state.days[k].beings.forEach(function (b) { tally[b] = (tally[b] || 0) + 1; }); });
        var top = Object.keys(tally).filter(function (b) { return tally[b] >= 2; })
          .sort(function (a, b) { return tally[b] - tally[a] || a.localeCompare(b, "he"); }).slice(0, 8);
        if (top.length) {
          html += '<div class="often"><h2>ההוויות שבחרת הכי הרבה, מתוך ' + keys.length + " ימים</h2><ul>" +
            top.map(function (b) {
              return "<li>" + esc(b) + "<span>" + tally[b] + "</span></li>";
            }).join("") + "</ul></div>";
        }
      }
      var month = "";
      keys.forEach(function (k) {
        var m = k.slice(0, 7);
        if (m !== month) {
          if (month) html += "</ol></div>";
          month = m;
          html += '<div class="month"><h2>' + esc(fmt(k, { month: "long", year: "numeric" })) + "</h2><ol>";
        }
        var day = state.days[k], dayNotes = day.notes || {}, cd = day.clearday || {};
        var written = day.beings.filter(function (b) { return dayNotes[b]; });
        html += '<li><p class="when">' + esc(fmt(k, { weekday: "long", day: "numeric", month: "long" })) +
          (k === todayKey ? "<b>היום</b>" : "") + "</p>";
        if (!day.beings.length) {
          html += '<p class="what quiet">לא נבחרו הוויות ביום הזה</p>';
        } else if (!written.length) {
          html += '<p class="what">' + esc(day.beings.join(", ")) + "</p>";
        } else {
          html += day.beings.map(function (b) {
            return '<p class="what">' + esc(b) + "</p>" +
              (dayNotes[b] ? '<p class="said">' + esc(dayNotes[b]) + "</p>" : "");
          }).join("");
        }
        // the answers sit folded, so a month of days still reads at a glance
        var answered = QUESTIONS.filter(function (q) { return !q.beings && cd[q.id]; });
        if (answered.length) {
          var open = !!state.openDays[k];
          html += '<button type="button" class="cd-more" data-act="cd-toggle" data-day="' + k +
            '" aria-expanded="' + open + '">Clearday, ' +
            (answered.length === 1 ? "תשובה אחת" : answered.length + " תשובות") + "</button>";
          if (open) {
            html += '<div class="cd-read">' + answered.map(function (q) {
              return '<p class="cd-rq">' + esc(ask(q)) + '</p><p class="said">' + esc(cd[q.id]) + "</p>";
            }).join("") + "</div>";
          }
        }
        html += "</li>";
      });
      html += "</ol></div>";
    }
    html += '<p class="where">' + (state.user ? "היומן נשמר בחשבון שלך." : "היומן נשמר בדפדפן הזה בלבד.") + "</p></section>";
    app.innerHTML = html;
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (ev) {
    var t2 = ev.target.closest("button");
    if (!t2) return;
    if (t2.dataset.being) return togglePick(t2.dataset.being);
    switch (t2.dataset.act) {
      case "gender": return setGender(t2.dataset.gender);
      case "theme": return setTheme(t2.dataset.theme);
      case "marks": return setMarks(t2.dataset.marks === "on");
      case "go-beings":
        state.view = "today";
        var d = state.days[dayKey()];
        if (d && d.beings.length) startEdit();
        else { state.editing = false; render(); }
        return;
      case "cd-toggle":
        state.openDays[t2.dataset.day] = !state.openDays[t2.dataset.day];
        render(true);
        return;
      case "auth-google": return authGoogle();
      case "auth-go": return authSubmit();
      case "auth-reset": return authReset();
      case "auth-mode":
        state.authMode = state.authMode === "up" ? "in" : "up";
        state.msg = null;
        return render(true);
      case "sign-out":
        if (cloud.api) cloud.api.signOut();
        return;
      case "note-open": return openNote(t2.dataset.word);
      case "note-save": return saveNote();
      case "note-cancel": return closeNote();
      case "save": return saveToday();
      case "cancel": return cancelEdit();
      case "edit": return startEdit();
      case "save-wallpaper": return saveWallpaper(state.days[dayKey()]);
      case "quiet":
        document.body.classList.add("quiet");
        document.querySelector(".wake").focus();
        return;
    }
  });
  app.addEventListener("input", function (ev) {
    var box = ev.target;
    if (!box.classList || !box.classList.contains("cd-box")) return;
    grow(box);
    cdType(box.dataset.q, box.value);
  });
  app.addEventListener("keydown", function (ev) {
    if (ev.target.classList.contains("note-input") && ev.key === "Escape") { ev.preventDefault(); closeNote(); }
    if (ev.target.classList.contains("input") && ev.key === "Enter") { ev.preventDefault(); authSubmit(); }
  });
  document.querySelector(".wake").addEventListener("click", function () { document.body.classList.remove("quiet"); });
  navButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      if (!state.gender) return;
      state.view = b.dataset.view;
      if (state.view !== "today") { state.editing = false; state.picks = emptyPicks(); }
      render();
    });
  });

  /* a new morning resets the choice, even if the page stayed open */
  var lastKey = dayKey();
  function checkDay() {
    var k = dayKey();
    if (k === lastKey) return;
    lastKey = k;
    cdFlush();
    state.picks = emptyPicks();
    state.editing = false;
    state.noteFor = null;
    state.openDays = {};
    state.view = "today";
    render(true);
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { checkDay(); checkForUpdate(); } });
  window.addEventListener("focus", function () { checkDay(); checkForUpdate(); });

  /* ---------- always run the newest version the server has ----------
     the page is one file, so its own style and script blocks are its version.
     on every opening it is fetched again, past the browser cache, and if it
     differs from what is running here the page reloads itself.              */
  var K_SEEN = "havayot.seen.v1";
  var lastCheck = 0;

  // only inline blocks count: scripts that arrive by src at run time (Firebase Auth adds
  // some on phones) are not part of the file, and would make every check look like news
  function fingerprint(doc) {
    var parts = [];
    Array.prototype.forEach.call(doc.querySelectorAll("style, script:not([src])"), function (n) { parts.push(n.textContent); });
    var text = parts.join("\u0000"), h = 5381;
    for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
    return h + "." + text.length;
  }

  function checkForUpdate() {
    if (!window.fetch || !window.DOMParser) return;
    var now = Date.now();
    if (now - lastCheck < 60000) return;            // at most once a minute
    lastCheck = now;
    fetch(location.pathname + "?fresh=" + now, { cache: "no-store" })
      .then(function (res) { return res.ok ? res.text() : null; })
      .then(function (text) {
        if (!text) return;
        var there = fingerprint(new DOMParser().parseFromString(text, "text/html"));
        if (there === fingerprint(document)) return;      // already the newest
        var tried = null;
        try { tried = sessionStorage.getItem(K_SEEN); } catch (e) { /* storage off */ }
        if (tried === there) return;                      // tried once already, do not loop
        try { sessionStorage.setItem(K_SEEN, there); } catch (e) { /* nothing to do */ }
        if (state.editing || state.noteFor) return;       // never cut into writing, next time then
        location.reload();
      })
      .catch(function () { /* offline: keep running what we have */ });
  }

  load();
  render();
  checkForUpdate();
  if (WANTS_CLOUD) setTimeout(function () { if (!state.authKnown) cloud.onDown(); }, 9000);
})();
</script>

<script type="module">
  // Loaded only when a project is configured. It lives in its own module, so if the
  // network or the browser blocks it, the app above simply stays in local mode.
  var bridge = window.Havayot;
  if (bridge.configured) {
    try {
      var V = "https://www.gstatic.com/firebasejs/10.14.1/";
      var appMod = await import(V + "firebase-app.js");
      var authMod = await import(V + "firebase-auth.js");
      var dbMod = await import(V + "firebase-firestore.js");

      var app = appMod.initializeApp(bridge.config);
      var auth = authMod.getAuth(app);
      var db = dbMod.getFirestore(app);
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);

      var SAYS = {
        "auth/invalid-email": "כתובת המייל אינה תקינה.",
        "auth/missing-password": "צריך למלא סיסמה.",
        "auth/weak-password": "הסיסמה קצרה מדי, צריך שישה תווים לפחות.",
        "auth/email-already-in-use": "כבר קיים חשבון עם המייל הזה. אפשר להיכנס איתו.",
        "auth/invalid-credential": "מייל או סיסמה שגויים.",
        "auth/wrong-password": "מייל או סיסמה שגויים.",
        "auth/user-not-found": "לא נמצא חשבון עם המייל הזה.",
        "auth/too-many-requests": "יותר מדי ניסיונות. נסה שוב עוד כמה דקות.",
        "auth/network-request-failed": "אין חיבור לרשת כרגע.",
        "permission-denied": "אין הרשאה לקרוא או לכתוב. צריך לעדכן את כללי הגישה ב Firestore."
      };
      function say(err) {
        var code = err && (err.code || err.message) || "";
        bridge.onProblem(SAYS[code] || ("משהו השתבש: " + code));
      }

      var stopDays = null, stopSet = null;
      function watch(uid) {
        var first = { days: true, set: true };
        stopDays = dbMod.onSnapshot(dbMod.collection(db, "users", uid, "days"), function (snap) {
          var out = {};
          snap.forEach(function (d) { out[d.id] = d.data(); });
          bridge.onDays(out, first.days);
          first.days = false;
        }, say);
        stopSet = dbMod.onSnapshot(dbMod.doc(db, "users", uid), function (d) {
          bridge.onSettings(d.exists() ? d.data() : null, first.set);
          first.set = false;
        }, say);
      }
      function unwatch() {
        if (stopDays) stopDays();
        if (stopSet) stopSet();
        stopDays = stopSet = null;
      }

      bridge.api = {
        signInWithGoogle: function () {
          var provider = new authMod.GoogleAuthProvider();
          authMod.signInWithPopup(auth, provider).catch(say);
        },
        signIn: function (email, password) {
          authMod.signInWithEmailAndPassword(auth, email, password).catch(say);
        },
        signUp: function (email, password) {
          authMod.createUserWithEmailAndPassword(auth, email, password).catch(say);
        },
        reset: function (email) {
          authMod.sendPasswordResetEmail(auth, email)
            .then(function () { bridge.onNotice("נשלח אליך מייל לאיפוס הסיסמה."); })
            .catch(say);
        },
        signOut: function () { authMod.signOut(auth).catch(say); },
        putDay: function (key, day) {
          var uid = auth.currentUser && auth.currentUser.uid;
          if (!uid) return;
          dbMod.setDoc(dbMod.doc(db, "users", uid, "days", key), {
            date: key,
            beings: day.beings.slice(),
            notes: day.notes || {},
            clearday: day.clearday || {},
            savedAt: day.savedAt || new Date().toISOString()
          }).catch(say);
        },
        putSettings: function (set) {
          var uid = auth.currentUser && auth.currentUser.uid;
          if (!uid) return;
          dbMod.setDoc(dbMod.doc(db, "users", uid), set, { merge: true }).catch(say);
        }
      };

      authMod.onAuthStateChanged(auth, function (user) {
        unwatch();
        if (user) watch(user.uid);
        bridge.onUser(user ? { uid: user.uid, email: user.email } : null);
      });
    } catch (e) {
      bridge.onDown();
    }
  }
</script>
</body>
</html>
